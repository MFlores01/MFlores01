name: Generate Galaga

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: manikeshmk/galaga-contribution-graph@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move output
        run: |
          mkdir -p dist
          cp ${{ github.action_path }}/../manikeshmk-galaga-contribution-graph/dist/galaga.svg dist/galaga-contribution-graph.svg || cp */dist/galaga.svg dist/galaga-contribution-graph.svg || find / -name "galaga.svg" 2>/dev/null | head -1 | xargs -I{} cp {} dist/galaga-contribution-graph.svg
          cp dist/galaga-contribution-graph.svg dist/galaga-contribution-graph-dark.svg
        shell: bash

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
